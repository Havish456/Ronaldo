<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cr7-shield-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef011d"/>
      <stop offset="100%" stop-color="#b30015"/>
    </linearGradient>
    <linearGradient id="cr7-gold-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#e6b800"/>
    </linearGradient>
    <filter id="cr7-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-opacity="0.4" flood-color="#ef011d"/>
    </filter>
  </defs>
  <!-- Shield shape: heraldic rounded-top shield -->
  <path
    d="M100,12 C160,12 200,60 200,120 C200,180 150,224 100,232 C50,224 0,180 0,120 C0,60 40,12 100,12 Z"
    fill="url(#cr7-shield-gradient)"
    filter="url(#cr7-shadow)"
  />
  <!-- Crown: 5 stylized peaks -->
  <path
    d="M72 52 L80 42 L88 52 L96 42 L104 52 L112 42 L120 52 L120 60 L72 60 Z"
    fill="url(#cr7-gold-gradient)"
    stroke="#ffffff"
    stroke-width="0.5"
    stroke-opacity="0.6"
  />
  <!-- CR7 text: bold, geometric, white with red glow -->
  <text
    x="100"
    y="160"
    text-anchor="middle"
    font-family="Inter, system-ui, sans-serif"
    font-weight="900"
    font-size="84"
    fill="#ffffff"
    letter-spacing="-3"
    text-shadow="0 0 8px rgba(239,1,29,0.4)"
  >CR7</text>
  <!-- Small accent underline -->
  <line x1="60" y1="184" x2="140" y2="184" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>
</svg>