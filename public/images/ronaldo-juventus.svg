<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="juveGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#1e1e1e" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#0a0a0a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0.98"/>
    </radialGradient>
    <filter id="blurFilterJuve">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>
  
  <!-- Deep dark base -->
  <rect width="1920" height="1080" fill="#070707"/>
  <rect width="1920" height="1080" fill="url(#juveGlow)"/>
  
  <!-- Bianconeri vertical stripes aesthetic -->
  <g opacity="0.07">
    <rect x="200" y="0" width="120" height="1080" fill="#ffffff"/>
    <rect x="440" y="0" width="120" height="1080" fill="#ffffff"/>
    <rect x="680" y="0" width="120" height="1080" fill="#ffffff"/>
    <rect x="920" y="0" width="120" height="1080" fill="#ffffff"/>
    <rect x="1160" y="0" width="120" height="1080" fill="#ffffff"/>
    <rect x="1400" y="0" width="120" height="1080" fill="#ffffff"/>
    <rect x="1640" y="0" width="120" height="1080" fill="#ffffff"/>
  </g>
  
  <!-- Italian Scudetto gold & spotlight accents -->
  <g opacity="0.3" filter="url(#blurFilterJuve)">
    <circle cx="960" cy="380" r="300" fill="#fbbf24" opacity="0.2"/>
    <circle cx="400" cy="500" r="280" fill="#ffffff" opacity="0.15"/>
    <circle cx="1520" cy="500" r="280" fill="#ffffff" opacity="0.15"/>
  </g>
  
  <!-- Watermark text -->
  <text x="960" y="620" font-family="'Inter', sans-serif" font-weight="900" font-size="280" fill="#ffffff" opacity="0.04" text-anchor="middle" letter-spacing="25">JUVENTUS</text>
  <text x="960" y="850" font-family="'Inter', sans-serif" font-weight="900" font-size="140" fill="#fbbf24" opacity="0.05" text-anchor="middle" letter-spacing="30">SERIE A • TURIN</text>
  
  <!-- Vignette -->
  <radialGradient id="vignetteJuve" cx="50%" cy="50%" r="60%">
    <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignetteJuve)"/>
</svg>
