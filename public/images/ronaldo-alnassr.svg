<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="nassrGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#1e3a8a" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0.98"/>
    </radialGradient>
    <filter id="blurFilterNassr">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>
  
  <!-- Deep dark base -->
  <rect width="1920" height="1080" fill="#06080d"/>
  <rect width="1920" height="1080" fill="url(#nassrGlow)"/>
  
  <!-- Al-Awwal Park Gold & Royal Blue lights -->
  <g opacity="0.45" filter="url(#blurFilterNassr)">
    <circle cx="960" cy="380" r="350" fill="#fbbf24" opacity="0.35"/>
    <circle cx="450" cy="300" r="300" fill="#3b82f6" opacity="0.3"/>
    <circle cx="1470" cy="300" r="300" fill="#f59e0b" opacity="0.3"/>
    <circle cx="960" cy="800" r="400" fill="#1e40af" opacity="0.25"/>
  </g>
  
  <!-- Geometric Golden Ray lines -->
  <g opacity="0.08" stroke="#fcd34d" stroke-width="1.5">
    <line x1="960" y1="0" x2="0" y2="1080"/>
    <line x1="960" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="960" y1="0" x2="1440" y2="1080"/>
    <line x1="960" y1="0" x2="1920" y2="1080"/>
  </g>
  
  <!-- Watermark text -->
  <text x="960" y="630" font-family="'Inter', sans-serif" font-weight="900" font-size="270" fill="#fbbf24" opacity="0.05" text-anchor="middle" letter-spacing="25">AL-NASSR</text>
  <text x="960" y="860" font-family="'Inter', sans-serif" font-weight="900" font-size="140" fill="#38bdf8" opacity="0.04" text-anchor="middle" letter-spacing="30">RIYADH • 977 GOALS</text>
  
  <!-- Vignette -->
  <radialGradient id="vignetteNassr" cx="50%" cy="50%" r="60%">
    <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignetteNassr)"/>
</svg>
